services:
  review:
    build: .
    ports:
      - "127.0.0.1:4810:4800"
    environment:
      REVIEW_TOKEN: ${REVIEW_TOKEN:?Set REVIEW_TOKEN for the reviewer API}
    volumes:
      - review-data:/data
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4800/api/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  review-data:
