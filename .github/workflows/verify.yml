name: Verify document review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      BENTOML_HOME: ${{ github.workspace }}/.bentoml
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - run: python -m pip install -r requirements-ops.lock
      - run: python -m unittest discover -s tests -v
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: node frontend/tests/client.test.mjs && npm --prefix frontend run build
      - run: python scripts/browser_check.py
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
